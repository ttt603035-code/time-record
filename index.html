<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Time Record" />
  <title>Time Record</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css?v=20260822c" />
</head>
<body>
  <div class="app" id="app">

    <!-- ───────────────────────── SCREEN: CALENDAR ───────────────────────── -->
    <main class="screen is-active" id="screen-calendar" aria-label="Calendar">

      <header class="topbar">
        <h1 class="page-title" data-i18n="calendar">Calendar</h1>
        <div class="topbar-end">
          <div class="sync-actions">
            <button class="chip search-chip" type="button" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            </button>
            <button class="chip sync-chip" type="button"><span class="sync-chip-label">Sync · Off</span></button>
            <button class="chip sync-refresh" type="button" aria-label="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              <span class="sync-refresh-label">Refresh</span>
            </button>
          </div>
        </div>
      </header>

      <div class="month-nav" role="group" aria-label="Month navigation">
        <button class="icon-btn" id="monthNavPrev" type="button" aria-label="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="month-title" id="monthTitleBtn" type="button" aria-haspopup="dialog" aria-label="Select month and year">
          <span id="monthTitleText">August 2026</span>
          <svg class="chevron-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="monthNavNext" type="button" aria-label="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <section class="calendar-surface" aria-label="Calendar grid">
        <div class="weekday-header" id="weekdayHeader" role="row"></div>
        <div class="grid-viewport" id="gridViewport">
          <div class="calendar-grid" id="calendarGrid" role="grid"></div>
        </div>
      </section>

      <section class="day-detail" id="dayDetail" aria-label="Selected day">
        <div class="day-detail-head">
          <h2 class="day-label" id="dayLabel">Sunday, August 16</h2>
          <button class="add-btn" id="btnAddDay" type="button" aria-label="Add event for this day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="events-list" id="eventsList"></div>
      </section>

    </main>

    <!-- ───────────────────────── SCREEN: TODAY ───────────────────────── -->
    <main class="screen" id="screen-today" aria-label="Today" hidden>
      <header class="topbar">
        <h1 class="page-title" data-i18n="today">Today</h1>
        <div class="topbar-end">
          <div class="sync-actions">
            <button class="chip search-chip" type="button" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            </button>
            <button class="chip sync-chip" type="button"><span class="sync-chip-label">Sync · Off</span></button>
            <button class="chip sync-refresh" type="button" aria-label="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              <span class="sync-refresh-label">Refresh</span>
            </button>
          </div>
          <button class="add-btn" id="btnAddToday" type="button" aria-label="Add event for today">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="today-hero">
        <h2 class="today-date" id="todayDate">Saturday, August 16</h2>
        <div class="today-meta" id="todayMeta"></div>
      </div>

      <div class="events-list" id="todayList"></div>
    </main>

    <!-- ───────────────────────── SCREEN: INSIGHTS ───────────────────────── -->
    <main class="screen" id="screen-insights" aria-label="Insights" hidden>
      <header class="topbar">
        <h1 class="page-title" data-i18n="insights">Insights</h1>
        <div class="topbar-end">
          <div class="sync-actions">
            <button class="chip sync-chip" type="button"><span class="sync-chip-label">Sync · Off</span></button>
            <button class="chip sync-refresh" type="button" aria-label="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              <span class="sync-refresh-label">Refresh</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Drill-down navigation: Overview → Category → Task -->
      <nav class="insights-nav" id="insightsNav" aria-label="Analytics navigation" hidden>
        <button class="insights-back" id="insightsBack" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="insights-nav-title" id="insightsNavTitle"></div>
      </nav>

      <div class="insights-seg" id="insightsSeg" role="tablist"></div>
      <div class="insights-period" id="insightsPeriod"></div>
      <div class="insights-body" id="insightsBody"></div>
    </main>

    <!-- ───────────────────────── SCREEN: MORE ───────────────────────── -->
    <main class="screen" id="screen-more" aria-label="More" hidden>
      <header class="topbar">
        <h1 class="page-title" data-i18n="more">More</h1>
        <div class="sync-actions">
          <button class="chip sync-chip" id="syncChip" type="button" hidden><span class="sync-chip-label" id="syncChipLabel">Sync · Off</span></button>
          <button class="chip sync-refresh" id="btnRefresh" type="button" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span class="sync-refresh-label">Refresh</span>
          </button>
        </div>      </header>

      <div class="more-groups" id="moreGroups"></div>
    </main>

    <!-- ───────────────────────── BOTTOM TAB BAR ───────────────────────── -->
    <nav class="tabbar" aria-label="Primary">
      <div class="tabbar-capsule">
        <span class="tabbar-indicator" id="tabIndicator" aria-hidden="true"></span>
        <button class="tab-item is-active" type="button" data-tab="calendar" aria-label="Calendar" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
          <span class="tab-label" data-i18n="calendar">Calendar</span>
        </button>
        <button class="tab-item" type="button" data-tab="today" aria-label="Today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="tab-label" data-i18n="today">Today</span>
        </button>
        <button class="tab-item" type="button" data-tab="insights" aria-label="Insights">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg>
          <span class="tab-label" data-i18n="insights">Insights</span>
        </button>
        <button class="tab-item" type="button" data-tab="more" aria-label="More">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          <span class="tab-label" data-i18n="more">More</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- Overlay container: sheets, dialogs, modals, toast render here -->
  <div id="overlays" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="app.js?v=20260822c"></script>
</body>
</html>
